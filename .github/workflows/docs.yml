name: Documentation
on:
  pull_request:
  push:
    branches:
      - main
    tags: ["*"]
  repository_dispatch:
    types: [tagbot-release-created]
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    env:
      # Pin by full commit SHA, not tag name — Pkg ≥ 1.13 (which unpinned setup-julia resolves since ~Sep 10)
      # fetches non-SHA revs via a shallow +refs/heads/<rev> fetch that exits 128 for tag-only names.
      # SHA revs resolve on every Pkg version. To bump: update the SHA and the tag comment together.
      DOC_TEMPLATE_VERSION: "d0eb7521809d7e7331d9ae8e5f3b0b2828b4a2a1" # PiccoloDocsTemplate v0.7.0
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      - name: Configure access to private Harmoniqs deps
        env:
          HARMONIQS_CI_TOKEN: ${{ secrets.HARMONIQS_CI_TOKEN }}
        if: env.HARMONIQS_CI_TOKEN != ''
        run: |
          git config --global url."https://x-access-token:${HARMONIQS_CI_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Use Documentation Template
        run: |
          ./docs/get_docs_utils.sh ${{ env.DOC_TEMPLATE_VERSION }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation-build
          path: docs/build/
          retention-days: 1
      - run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using Legato
            DocMeta.setdocmeta!(Legato, :DocTestSetup, :(using Legato); recursive=true)
            doctest(Legato)'

  tagbot-dispatch:
    name: Dispatch on TagBot Release
    runs-on: ubuntu-latest
    needs: docs
    if: github.event_name == 'repository_dispatch'
    steps:
      - name: Dispatch PiccoloMultiDocs workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: harmoniqs/PiccoloMultiDocs.jl
          event-type: rebuild-docs

  tag-push-dispatch:
    name: Dispatch on Tag Push
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref_type == 'tag'
    steps:
      - name: Dispatch PiccoloMultiDocs workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: harmoniqs/PiccoloMultiDocs.jl
          event-type: rebuild-docs
